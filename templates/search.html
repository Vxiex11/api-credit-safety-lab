<!DOCTYPE html>
<html>
<head><title>Bcador de Expedientes</title></head>
<body style="font-family: sans-serif; padding: 30px;">
    <h2>Buscador de Alumnos</h2>
    <form method="POST">
        <p>Nombre de alumno: <input type="text" name="query" value="{{ query_str }}"></p>
        <p><button type="submit">Buscar</button></p>
    </form>
    <h3>Resultados:</h3>
    <ul>
        {% for r in results %}
            <li>{{ r.username }} - Calificación: {{ r.grade }} - Estatus: {{ r.status }}</li>
        {% endfor %}
    </ul>
    <p><a href="/profile">Volver a mi perfil</a></p>
</body>
</html>
